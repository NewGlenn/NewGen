<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S. — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#010204;
    --bg-1:#040914;
    --bg-2:#070f1e;
    --cyan:#6df3ff;
    --cyan-soft:#8ff6ff;
    --cyan-dim:rgba(109,243,255,.55);
    --cyan-dim2:rgba(109,243,255,.22);
    --cyan-dim3:rgba(109,243,255,.09);
    --green:#4dffa0;
    --amber:#ffb238;
    --amber-dim:rgba(255,178,56,.5);
    --red:#ff5c6a;
    --red-dim:rgba(255,92,106,.5);
    --text-hi:#e9fbff;
    --text-dim:rgba(179,226,236,.62);
    --text-faint:rgba(150,200,215,.36);
    --font-head:'Orbitron', 'Segoe UI', sans-serif;
    --font-mono:'Share Tech Mono', 'Consolas', monospace;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:
      radial-gradient(ellipse 90% 70% at 50% 38%, var(--bg-2) 0%, var(--bg-1) 55%, var(--bg-0) 100%);
    color:var(--text-hi);
    font-family:var(--font-mono);
    overflow:hidden;
    cursor:default;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------------------------------------------------------------- canvas */
  #sphere{
    position:fixed; inset:0; z-index:1; display:block; width:100%; height:100%;
  }

  /* ------------------------------------------------------------ HUD shell */
  .hud{
    position:fixed; inset:0; z-index:5;
    display:flex; flex-direction:column; justify-content:space-between;
    padding:26px 34px 20px;
    pointer-events:none;
  }

  .hud-top{
    display:flex; justify-content:space-between; align-items:flex-start;
    gap:20px;
  }

  /* -------------------------------------------------------------- title */
  .top-left{ pointer-events:auto; }
  .title{
    margin:0; font-family:var(--font-head); font-weight:900;
    font-size:clamp(22px, 3vw, 34px); letter-spacing:6px;
    color:var(--text-hi);
    text-shadow:0 0 6px var(--cyan-dim), 0 0 26px var(--cyan-dim2), 0 0 60px var(--cyan-dim3);
  }
  .greeting{
    margin-top:6px; font-size:12.5px; letter-spacing:3px;
    color:var(--cyan-soft); text-shadow:0 0 8px var(--cyan-dim2);
  }
  .gendate{
    margin-top:4px; font-size:10.5px; letter-spacing:1.5px; color:var(--text-faint);
  }

  /* ------------------------------------------------------------ top right */
  .top-right{ pointer-events:auto; text-align:right; min-width:220px; }
  .clock{
    font-family:var(--font-head); font-weight:700; font-size:clamp(20px,2.6vw,30px);
    letter-spacing:3px; color:var(--cyan);
    text-shadow:0 0 8px var(--cyan-dim), 0 0 24px var(--cyan-dim2);
    font-variant-numeric:tabular-nums;
  }
  .connectors{
    list-style:none; margin:10px 0 0; padding:0;
    display:flex; flex-direction:column; gap:5px; align-items:flex-end;
  }
  .connectors li{
    display:flex; align-items:center; gap:8px; font-size:10.5px;
    letter-spacing:1.5px; color:var(--text-dim);
  }
  .dot{
    width:7px; height:7px; border-radius:50%; flex:none;
    box-shadow:0 0 6px currentColor, 0 0 2px currentColor;
  }
  .dot.online{ background:var(--green); color:var(--green); }
  .dot.offline{
    background:var(--amber); color:var(--amber);
    animation:blinkDot 1.1s ease-in-out infinite;
  }
  @keyframes blinkDot{ 0%,100%{opacity:1;} 50%{opacity:.18;} }

  /* -------------------------------------------------------------- mid row */
  .mid-row{
    flex:1; display:flex; justify-content:space-between;
    align-items:stretch; gap:16px; min-height:0;
  }

  .panel{
    pointer-events:auto;
    width:270px; max-width:32vw;
    background:linear-gradient(180deg, rgba(8,18,30,.42), rgba(6,12,22,.28));
    border:1px solid var(--cyan-dim3);
    backdrop-filter:blur(3px);
    padding:14px 16px 16px;
    position:relative;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--cyan-dim3) transparent;
  }
  .panel::-webkit-scrollbar{ width:5px; }
  .panel::-webkit-scrollbar-thumb{ background:var(--cyan-dim3); border-radius:3px; }
  .panel::before, .panel::after,
  .panel .corner-tr, .panel .corner-bl{
    content:''; position:absolute; width:14px; height:14px;
    border-color:var(--cyan-dim); border-style:solid; opacity:.7;
  }
  .panel::before{ top:-1px; left:-1px; border-width:2px 0 0 2px; }
  .panel::after{ bottom:-1px; right:-1px; border-width:0 2px 2px 0; }

  .panel-label{
    font-family:var(--font-head); font-size:10.5px; letter-spacing:3px;
    color:var(--cyan-soft); opacity:.85; margin-bottom:10px;
    padding-bottom:6px; border-bottom:1px solid var(--cyan-dim3);
  }

  /* ------------------------------------------------------------- log left */
  .log-panel{ display:flex; flex-direction:column; }
  .log-list{
    flex:1; display:flex; flex-direction:column; gap:9px;
    font-size:10.5px; line-height:1.4; letter-spacing:.4px;
    color:var(--text-dim); overflow:hidden;
  }
  .log-line{
    opacity:0; transform:translateY(6px);
    transition:opacity .55s ease, transform .55s ease;
    border-left:2px solid var(--cyan-dim2); padding-left:8px;
  }
  .log-line.show{ opacity:1; transform:none; }
  .log-line.top-priority{ color:var(--amber); border-left-color:var(--amber-dim); }

  /* ----------------------------------------------------------- stats right */
  .stats-panel{ text-align:left; }
  .bars{ display:flex; flex-direction:column; gap:11px; }
  .bar-row .bar-meta{
    display:flex; justify-content:space-between; font-size:10px;
    letter-spacing:1px; color:var(--text-dim); margin-bottom:4px;
  }
  .bar-meta b{ color:var(--cyan-soft); font-weight:400; }
  .bar-track{
    height:5px; background:rgba(109,243,255,.08); border-radius:3px; overflow:hidden;
  }
  .bar-fill{
    height:100%; width:0; border-radius:3px;
    background:linear-gradient(90deg, rgba(109,243,255,.35), var(--cyan));
    box-shadow:0 0 8px var(--cyan-dim), 0 0 2px var(--cyan);
    transition:width 1.4s cubic-bezier(.2,.8,.2,1);
  }

  .accounts-panel{ margin-top:16px; padding-top:10px; border-top:1px solid var(--cyan-dim3); }
  .account-row{
    display:flex; justify-content:space-between; align-items:center; gap:8px;
    font-size:10px; letter-spacing:.6px; color:var(--text-dim); padding:4px 0;
  }
  .account-row .acct-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .account-row .acct-tasks{ color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .account-row .acct-status{
    display:inline-flex; align-items:center; gap:5px; letter-spacing:1px;
    text-transform:uppercase; font-size:8.5px;
  }
  .acct-status::before{
    content:''; width:6px; height:6px; border-radius:50%;
    background:currentColor; box-shadow:0 0 6px currentColor;
  }
  .acct-status.st-ontrack{ color:var(--green); }
  .acct-status.st-active{ color:var(--cyan-soft); }
  .acct-status.st-atrisk{ color:var(--amber); }
  .acct-status.st-blocked{ color:var(--red); }

  /* -------------------------------------------------------------- bottom */
  .hud-bottom{ display:flex; flex-direction:column; gap:12px; pointer-events:auto; }

  .headline-banner{
    font-family:var(--font-head); font-weight:700; text-align:center;
    font-size:clamp(13px, 1.9vw, 19px); letter-spacing:2.5px; color:var(--text-hi);
    text-shadow:0 0 10px var(--cyan-dim2), 0 0 30px var(--cyan-dim3);
  }

  .figures-row{
    display:flex; justify-content:center; gap:clamp(20px,5vw,64px); flex-wrap:wrap;
  }
  .figure{ text-align:center; }
  .figure .fig-value{
    font-family:var(--font-head); font-weight:800; font-size:clamp(20px,3vw,32px);
    color:var(--cyan); text-shadow:0 0 8px var(--cyan-dim), 0 0 22px var(--cyan-dim2);
    font-variant-numeric:tabular-nums;
  }
  .figure .fig-label{
    margin-top:2px; font-size:9.5px; letter-spacing:2.5px; color:var(--text-faint);
  }

  .flag-chip{
    align-self:center;
    display:flex; align-items:center; gap:8px;
    padding:7px 16px; border-radius:999px;
    border:1px solid var(--amber-dim);
    background:rgba(255,178,56,.08);
    color:var(--amber); font-size:10.5px; letter-spacing:1.5px;
    box-shadow:0 0 16px rgba(255,178,56,.18);
    animation:chipPulse 2.4s ease-in-out infinite;
  }
  @keyframes chipPulse{
    0%,100%{ box-shadow:0 0 10px rgba(255,178,56,.14); }
    50%{ box-shadow:0 0 22px rgba(255,178,56,.4); }
  }

  .bottom-bar{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    border-top:1px solid var(--cyan-dim3); padding-top:12px;
  }
  .ticker-wrap{ order:2; flex:1 1 260px; }
  #briefBtn{ order:1; }
  #handleFirstBtn{ order:3; }

  button.hud-btn{
    font-family:var(--font-head); font-weight:700; letter-spacing:2px;
    font-size:11.5px; color:var(--cyan-soft); background:rgba(109,243,255,.06);
    border:1px solid var(--cyan-dim); padding:11px 18px; border-radius:4px;
    cursor:pointer; white-space:nowrap; flex:none;
    box-shadow:0 0 10px rgba(109,243,255,.12), inset 0 0 10px rgba(109,243,255,.05);
    transition:box-shadow .25s ease, color .25s ease, background .25s ease;
  }
  button.hud-btn:hover{ background:rgba(109,243,255,.14); }
  #briefBtn.speaking{
    color:#01131a; background:var(--cyan);
    box-shadow:0 0 14px var(--cyan), 0 0 40px var(--cyan-dim2);
    animation:briefSpeak .5s ease-in-out infinite alternate;
  }
  @keyframes briefSpeak{
    from{ box-shadow:0 0 10px var(--cyan), 0 0 26px var(--cyan-dim2); }
    to{ box-shadow:0 0 22px var(--cyan), 0 0 56px var(--cyan-dim2); }
  }

  .ticker-wrap{
    flex:1; overflow:hidden; position:relative; height:16px;
    mask-image:linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
    -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
  }
  .ticker{
    position:absolute; white-space:nowrap; font-size:11px; letter-spacing:1.2px;
    color:var(--text-dim); animation:tickerScroll 32s linear infinite;
  }
  .ticker span{ color:var(--cyan-soft); margin:0 10px; }
  @keyframes tickerScroll{
    from{ transform:translateX(0); }
    to{ transform:translateX(-50%); }
  }

  /* --------------------------------------------------------- CRT overlays */
  .vignette{
    position:fixed; inset:0; z-index:8; pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 38%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.82) 100%);
  }
  .scanlines{
    position:fixed; inset:0; z-index:9; pointer-events:none; opacity:.5;
    mix-blend-mode:overlay;
    background:repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0px, rgba(255,255,255,.045) 1px, transparent 2px, transparent 3px);
    animation:scanShift 9s linear infinite;
  }
  @keyframes scanShift{ from{ background-position:0 0; } to{ background-position:0 120px; } }

  @media (max-width: 760px){
    .mid-row{ display:none; }
    .top-right{ min-width:0; }
    .figures-row{ gap:18px; }
  }
</style>
</head>
<body>

<canvas id="sphere"></canvas>

<div class="hud">
  <div class="hud-top">
    <div class="top-left">
      <h1 class="title">J.A.R.V.I.S.</h1>
      <div class="greeting" id="greeting"></div>
      <div class="gendate" id="gendate"></div>
    </div>
    <div class="top-right">
      <div class="clock" id="clock">00:00:00</div>
      <ul class="connectors" id="connectors"></ul>
    </div>
  </div>

  <div class="mid-row">
    <div class="panel log-panel">
      <div class="panel-label">ACTIVITY LOG</div>
      <div class="log-list" id="logList"></div>
    </div>
    <div class="panel stats-panel">
      <div class="panel-label">TASK PIPELINE</div>
      <div class="bars" id="bars"></div>
      <div class="accounts-panel" id="accountsPanel"></div>
    </div>
  </div>

  <div class="hud-bottom">
    <div class="headline-banner" id="headline"></div>
    <div class="figures-row" id="figures"></div>
    <div class="flag-chip" id="flagChip" hidden></div>
    <div class="bottom-bar">
      <button class="hud-btn" id="briefBtn">BRIEF ME</button>
      <div class="ticker-wrap"><div class="ticker" id="ticker"></div></div>
      <button class="hud-btn" id="handleFirstBtn">WHAT SHOULD I HANDLE FIRST</button>
    </div>
  </div>
</div>

<div class="vignette"></div>
<div class="scanlines"></div>

<audio id="briefAudio" src="jarvis_brief.mp3" preload="none"></audio>

<script>
/* --- jarvis_data.js inlined so this file is fully self-contained --- */
/**
 * jarvis_data.js
 * ---------------------------------------------------------------------------
 * Single source of data for dashboard.html — the J.A.R.V.I.S. command center
 * retooled for NewGen operations. Everything the HUD renders is read from
 * window.JARVIS_DATA at load time; edit this file to change what J.A.R.V.I.S.
 * reports. In production these values would be populated from ClickUp,
 * Calendar, Gmail and Slack — the figures below are illustrative examples.
 * ---------------------------------------------------------------------------
 */
window.JARVIS_DATA = {
  // Top-left header
  greeting: "GOOD EVENING, GLENN",
  generated: "WORKSPACE SYNC — SEP 14 2026 · 18:32 BST",

  // Top-right connector status list. status: "online" | "offline"
  connectors: [
    { name: "Gmail",            status: "online"  },
    { name: "Slack",            status: "online"  },
    { name: "Google Calendar",  status: "online"  },
    { name: "ClickUp",          status: "online"  },
    { name: "Google Drive",     status: "online"  },
  ],

  // Right-hand panel: task pipeline by status (thin glowing bars)
  workload: {
    stages: [
      { label: "To Do",       value: 9  },
      { label: "In Progress", value: 6  },
      { label: "In Review",   value: 4  },
      { label: "Done · 7d",   value: 18 },
    ],
  },

  // Accounts you work on, shown under the pipeline and woven into the ticker.
  // status: "On Track" | "Active" | "At Risk" | "Blocked"
  accounts: [
    { name: "Atlas Rebrand",     status: "On Track", tasks: 6 },
    { name: "Meridian Launch",   status: "Active",   tasks: 5 },
    { name: "Northwind Studios", status: "At Risk",  tasks: 4 },
    { name: "Vantage Media",     status: "On Track", tasks: 3 },
    { name: "Harbour & Co",      status: "Blocked",  tasks: 2 },
  ],

  // Priorities feed the streaming log, the flag chip and "handle first".
  // Mark the single most urgent item with overdue:true to drive the amber chip.
  priorities: [
    {
      label: "Finalise Atlas rebrand master deck",
      detail: "Client review call at 2:00 PM",
      due: "Today 11:00",
    },
    {
      label: "Approve Northwind edit v3",
      detail: "Sitting in the review queue 2 days",
      due: "Yesterday",
      overdue: true,
    },
    {
      label: "Send Meridian launch timeline",
      detail: "Team is blocked awaiting your sign-off",
      due: "Tomorrow",
    },
    {
      label: "Unblock Harbour asset delivery",
      detail: "Waiting on legal clearance to ship",
      due: "This week",
    },
  ],

  // Operational focus banner across the bottom of the HUD
  headline: "FOCUS TODAY — SHIP THE ATLAS DECK BY 2PM · CLEAR THE REVIEW QUEUE · UNBLOCK HARBOUR",

  // J.A.R.V.I.S.'s sign-off, folded into the ticker and the brief
  closer: "Your queue is under control, Glenn. I'll keep watch.",
};
</script>
<script>
(function(){
  "use strict";
  var DATA = window.JARVIS_DATA || {};

  /* ============================================================ helpers */
  function fmtNum(n){
    if (typeof n !== 'number') return n;
    return n.toLocaleString('en-US');
  }
  function pad2(n){ return n < 10 ? '0'+n : ''+n; }
  function statusClass(s){ return 'st-' + String(s || '').toLowerCase().replace(/[^a-z]/g, ''); }

  /* =================================================== static HUD fill */
  document.getElementById('greeting').textContent = DATA.greeting || '';
  document.getElementById('gendate').textContent = DATA.generated || '';
  document.getElementById('headline').textContent = DATA.headline || '';

  // Connectors
  (function renderConnectors(){
    var ul = document.getElementById('connectors');
    var list = DATA.connectors || [];
    list.forEach(function(c){
      var li = document.createElement('li');
      var dot = document.createElement('span');
      dot.className = 'dot ' + (c.status === 'online' ? 'online' : 'offline');
      li.appendChild(dot);
      var label = document.createElement('span');
      label.textContent = c.name + ' — ' + (c.status === 'online' ? 'ONLINE' : 'OFFLINE');
      li.appendChild(label);
      ul.appendChild(li);
    });
  })();

  // Task pipeline bars
  var STAGES = (DATA.workload && DATA.workload.stages) || [];
  (function renderBars(){
    var wrap = document.getElementById('bars');
    var max = Math.max.apply(null, STAGES.map(function(s){ return s.value; })) || 1;
    STAGES.forEach(function(s){
      var row = document.createElement('div');
      row.className = 'bar-row';
      row.innerHTML =
        '<div class="bar-meta"><span>' + s.label + '</span><b>' + fmtNum(s.value) + '</b></div>' +
        '<div class="bar-track"><div class="bar-fill"></div></div>';
      wrap.appendChild(row);
      var fill = row.querySelector('.bar-fill');
      var pct = Math.max(4, (s.value / max) * 100);
      requestAnimationFrame(function(){ fill.style.width = pct + '%'; });
    });
  })();

  // Accounts panel
  (function renderAccounts(){
    var wrap = document.getElementById('accountsPanel');
    var accounts = DATA.accounts || [];
    if (!accounts.length) return;
    var label = document.createElement('div');
    label.className = 'panel-label';
    label.style.marginBottom = '8px';
    label.textContent = 'ACCOUNTS';
    wrap.appendChild(label);
    accounts.forEach(function(a){
      var row = document.createElement('div');
      row.className = 'account-row';
      row.innerHTML =
        '<span class="acct-name">' + a.name + '</span>' +
        '<span class="acct-tasks">' + a.tasks + ' tasks</span>' +
        '<span class="acct-status ' + statusClass(a.status) + '">' + a.status + '</span>';
      wrap.appendChild(row);
    });
  })();

  // Big bottom figures, derived from the task pipeline, accounts and priorities
  (function renderFigures(){
    var wrap = document.getElementById('figures');
    var byLabel = {};
    STAGES.forEach(function(s){ byLabel[s.label.toLowerCase()] = s.value; });
    var open = STAGES.reduce(function(sum, s){
      return /done/i.test(s.label) ? sum : sum + s.value;
    }, 0);
    var priorities = DATA.priorities || [];
    var dueToday = priorities.filter(function(p){
      return /today/i.test(p.due) || p.overdue;
    }).length;
    var figs = [
      { label: 'OPEN TASKS',  value: open },
      { label: 'DUE TODAY',   value: dueToday },
      { label: 'IN REVIEW',   value: byLabel['in review'] || 0 },
      { label: 'ACCOUNTS',    value: (DATA.accounts || []).length },
    ];
    figs.forEach(function(f){
      var el = document.createElement('div');
      el.className = 'figure';
      el.innerHTML = '<div class="fig-value">' + fmtNum(f.value) + '</div><div class="fig-label">' + f.label + '</div>';
      wrap.appendChild(el);
    });
  })();

  // Amber flag chip — surfaces the most urgent overdue priority
  (function renderFlagChip(){
    var chip = document.getElementById('flagChip');
    var priorities = DATA.priorities || [];
    var flagged = priorities.find(function(p){ return p.overdue; });
    if (!flagged) return;
    chip.hidden = false;
    chip.textContent = '⚠ OVERDUE — ' + flagged.label + ' · DUE ' + flagged.due.toUpperCase();
  })();

  // Ticker
  (function renderTicker(){
    var el = document.getElementById('ticker');
    var parts = [];
    (DATA.accounts || []).forEach(function(a){
      parts.push(a.name + ' — ' + a.status.toUpperCase() + ' (' + a.tasks + ' tasks)');
    });
    if (DATA.headline) parts.push(DATA.headline);
    (DATA.priorities || []).forEach(function(p){
      parts.push(p.label + ' — DUE ' + p.due.toUpperCase());
    });
    if (DATA.closer) parts.push(DATA.closer);
    var joined = parts.join('   •   ');
    // duplicate for seamless marquee loop
    el.innerHTML = '<span>●</span>' + joined + '   ' +
      '<span>●</span>' + joined + '   ';
  })();

  /* ===================================================== live clock */
  (function clock(){
    var el = document.getElementById('clock');
    function tick(){
      var d = new Date();
      el.textContent = pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds());
    }
    tick();
    setInterval(tick, 1000);
  })();

  /* =============================================== streaming activity log */
  (function activityLog(){
    var list = document.getElementById('logList');
    var lines = [];

    lines.push({ text: 'SYSTEM ONLINE — ALL CONNECTORS NOMINAL' });
    (DATA.connectors || []).forEach(function(c){
      if (c.status !== 'online') {
        lines.push({ text: 'WARNING: ' + c.name.toUpperCase() + ' LINK DOWN — RETRYING' });
      }
    });
    STAGES.forEach(function(s){
      lines.push({ text: 'PIPELINE — ' + s.label.toUpperCase() + ': ' + fmtNum(s.value) });
    });
    (DATA.accounts || []).forEach(function(a){
      lines.push({ text: 'ACCOUNT — ' + a.name.toUpperCase() + ' · ' + a.status.toUpperCase() + ' · ' + a.tasks + ' TASKS' });
    });
    (DATA.priorities || []).forEach(function(p){
      lines.push({ text: (p.overdue ? 'OVERDUE — ' : 'PRIORITY QUEUED — ') + p.label.toUpperCase() + ' (DUE ' + p.due.toUpperCase() + ')' });
    });
    if (DATA.headline) lines.push({ text: DATA.headline });
    if (DATA.closer) lines.push({ text: DATA.closer.toUpperCase() });

    var idx = 0;
    var MAX_VISIBLE = 7;

    function pushLine(text, cls){
      var el = document.createElement('div');
      el.className = 'log-line' + (cls ? ' ' + cls : '');
      el.textContent = '> ' + text;
      list.insertBefore(el, list.firstChild);
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){ el.classList.add('show'); });
      });
      while (list.children.length > MAX_VISIBLE) {
        list.removeChild(list.lastChild);
      }
    }

    function pushNext(){
      if (!lines.length) return;
      var line = lines[idx % lines.length];
      idx++;
      pushLine(line.text);
    }

    pushNext();
    setInterval(pushNext, 1750);

    // exposed for the "WHAT SHOULD I HANDLE FIRST" button
    window.__jarvisPushTopPriority = function(){
      var p = (DATA.priorities || [])[0];
      if (!p) return;
      pushLine('TOP PRIORITY ★ ' + p.label.toUpperCase() + ' — ' + p.detail + ' (DUE ' + p.due.toUpperCase() + ')', 'top-priority');
    };
  })();

  document.getElementById('handleFirstBtn').addEventListener('click', function(){
    if (window.__jarvisPushTopPriority) window.__jarvisPushTopPriority();
  });

  /* ======================================================================
   *  CANVAS: J.A.R.V.I.S. energy sphere
   * ==================================================================== */
  var canvas = document.getElementById('sphere');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0, DPR = 1;

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2.5);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---- Fibonacci-distributed sphere points -------------------------------
  var NUM_POINTS = 680;
  var GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
  var points = [];
  for (var i = 0; i < NUM_POINTS; i++) {
    var yv = 1 - (i / (NUM_POINTS - 1)) * 2;
    var r = Math.sqrt(Math.max(0, 1 - yv * yv));
    var theta = GOLDEN_ANGLE * i;
    points.push({
      x: Math.cos(theta) * r,
      y: yv,
      z: Math.sin(theta) * r,
      seed: Math.random() * Math.PI * 2,
      sizeJit: 0.6 + Math.random() * 0.8
    });
  }

  var TILT = 0.42; // fixed tilt around X so the sphere reads as a globe
  var rotY = 0;

  // ---- state: idle breathing vs. speaking pulse --------------------------
  var speaking = false;
  var speakStart = 0;
  var speakPhases = [0, 0, 0];
  var envSmoothed = 0;
  var briefTimeout = null;

  function speechEnvelope(t){
    var a = Math.sin(t * 2 * Math.PI * 1.3 + speakPhases[0]) * 0.5 + 0.5;
    var b = Math.sin(t * 2 * Math.PI * 2.7 + speakPhases[1]) * 0.5 + 0.5;
    var c = Math.sin(t * 2 * Math.PI * 4.4 + speakPhases[2]) * 0.5 + 0.5;
    var v = a * 0.5 + b * 0.32 + c * 0.28;
    v += (Math.random() - 0.5) * 0.06; // organic jitter
    return Math.max(0, Math.min(1, v));
  }

  function rotatePoint(p, ang, tilt){
    // rotate around Y
    var cosA = Math.cos(ang), sinA = Math.sin(ang);
    var x1 = p.x * cosA + p.z * sinA;
    var z1 = -p.x * sinA + p.z * cosA;
    var y1 = p.y;
    // fixed tilt around X
    var cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    var y2 = y1 * cosT - z1 * sinT;
    var z2 = y1 * sinT + z1 * cosT;
    return { x: x1, y: y2, z: z2 };
  }

  var t0 = performance.now();
  var lastTime = t0;

  // HUD arc configs: [radius factor, dash pattern, rotation speed, alpha]
  var ARCS = [
    { rf: 1.55, dash: [2, 10], speed: 0.18,  width: 1, alpha: 0.5 },
    { rf: 1.78, dash: [14, 8], speed: -0.11, width: 1, alpha: 0.35 },
    { rf: 2.02, dash: [3, 6],  speed: 0.26,  width: 1, alpha: 0.28 }
  ];
  var RAY_COUNT = 16;
  var TICK_COUNT = 72;

  function frame(now){
    var dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    var t = (now - t0) / 1000;

    ctx.clearRect(0, 0, W, H);

    var cx = W / 2, cy = H / 2;
    var baseRadius = Math.min(W, H) * 0.19;

    // -------- breathing / speaking envelope --------
    var idleBreath = 1 + 0.035 * Math.sin(t * 0.6);
    var rotSpeed = 0.15;
    var coreAlpha, coreBoost;

    if (speaking) {
      var st = (now - speakStart) / 1000;
      var raw = speechEnvelope(st);
      envSmoothed += (raw - envSmoothed) * 0.25;
      var speakBreath = 1 + 0.06 + 0.22 * envSmoothed;
      rotSpeed = 0.15 * (1.6 + envSmoothed);
      coreAlpha = 0.55 + 0.45 * envSmoothed;
      coreBoost = 1 + envSmoothed * 0.9;
      var scale = baseRadius * speakBreath;
    } else {
      envSmoothed += (0 - envSmoothed) * 0.08;
      coreAlpha = 0.55 + 0.25 * Math.sin(t * 0.9);
      coreBoost = 1;
      var scale = baseRadius * idleBreath;
    }

    rotY += rotSpeed * dt;

    // -------- outer tick ring --------
    ctx.save();
    ctx.translate(cx, cy);
    for (var k = 0; k < TICK_COUNT; k++) {
      var ang = (k / TICK_COUNT) * Math.PI * 2;
      var long = (k % 6 === 0);
      var rOuter = scale * 2.34;
      var rInner = rOuter - (long ? 13 : 6);
      ctx.strokeStyle = 'rgba(109,243,255,' + (long ? 0.4 : 0.18) + ')';
      ctx.lineWidth = long ? 1.4 : 1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang) * rInner, Math.sin(ang) * rInner);
      ctx.lineTo(Math.cos(ang) * rOuter, Math.sin(ang) * rOuter);
      ctx.stroke();
    }
    ctx.restore();

    // -------- faint radial rays --------
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rotY * 0.15);
    for (var rc = 0; rc < RAY_COUNT; rc++) {
      var rAng = (rc / RAY_COUNT) * Math.PI * 2;
      var g = ctx.createLinearGradient(0, 0, Math.cos(rAng) * scale * 2.1, Math.sin(rAng) * scale * 2.1);
      g.addColorStop(0, 'rgba(109,243,255,.10)');
      g.addColorStop(1, 'rgba(109,243,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(Math.cos(rAng) * scale * 0.5, Math.sin(rAng) * scale * 0.5);
      ctx.lineTo(Math.cos(rAng) * scale * 2.1, Math.sin(rAng) * scale * 2.1);
      ctx.stroke();
    }
    ctx.restore();

    // -------- dashed HUD arcs, each rotating at its own speed --------
    ARCS.forEach(function(arc){
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(t * arc.speed);
      ctx.setLineDash(arc.dash);
      ctx.strokeStyle = 'rgba(109,243,255,' + arc.alpha + ')';
      ctx.lineWidth = arc.width;
      ctx.beginPath();
      ctx.arc(0, 0, scale * arc.rf, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    });

    // -------- tilted elliptical orbital ring + marker --------
    var ringRotation = 0.5 + Math.sin(t * 0.05) * 0.04;
    var ringSquash = 0.34;
    var ringRadius = scale * 1.9;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(ringRotation);
    ctx.scale(1, ringSquash);
    ctx.strokeStyle = 'rgba(109,243,255,.4)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(0, 0, ringRadius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // marker orbiting along that same ellipse
    var markerAngle = t * 0.7;
    var mx0 = Math.cos(markerAngle) * ringRadius;
    var my0 = Math.sin(markerAngle) * ringRadius * ringSquash;
    var cosR = Math.cos(ringRotation), sinR = Math.sin(ringRotation);
    var mx = cx + (mx0 * cosR - my0 * sinR);
    var my = cy + (mx0 * sinR + my0 * cosR);
    ctx.save();
    ctx.fillStyle = '#bffcff';
    ctx.shadowColor = 'rgba(109,243,255,.9)';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(mx, my, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // -------- soft outer glow behind the sphere --------
    var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 2.2);
    glow.addColorStop(0, 'rgba(109,243,255,' + (0.16 * coreBoost) + ')');
    glow.addColorStop(0.4, 'rgba(60,180,220,.07)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.save();
    ctx.fillStyle = glow;
    ctx.fillRect(cx - scale * 2.2, cy - scale * 2.2, scale * 4.4, scale * 4.4);
    ctx.restore();

    // -------- sphere points --------
    var projected = [];
    for (var p = 0; p < points.length; p++) {
      var rp = rotatePoint(points[p], rotY, TILT);
      var focal = 620;
      var persp = focal / (focal + rp.z * scale * 0.62);
      var twinkle = 0.75 + 0.25 * Math.sin(t * 2 + points[p].seed * 6);
      projected.push({
        x: cx + rp.x * scale * persp,
        y: cy + rp.y * scale * persp,
        z: rp.z,
        persp: persp,
        size: (0.9 + persp * 1.3) * points[p].sizeJit,
        depthA: (rp.z + 1) / 2,
        twinkle: twinkle
      });
    }
    projected.sort(function(a, b){ return a.z - b.z; });

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var q = 0; q < projected.length; q++) {
      var pt = projected[q];
      var alpha = (0.12 + pt.depthA * 0.55) * pt.twinkle * (0.85 + 0.4 * coreBoost - 0.4);
      alpha = Math.max(0.04, Math.min(0.95, alpha));
      ctx.fillStyle = 'rgba(120,240,255,' + alpha.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();

    // -------- bright pulsing core --------
    var coreR = scale * 0.115 * (1 + envSmoothed * 0.5);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    var coreGlow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR * 3.4);
    coreGlow.addColorStop(0, 'rgba(230,255,255,' + coreAlpha + ')');
    coreGlow.addColorStop(0.35, 'rgba(109,243,255,' + (coreAlpha * 0.55) + ')');
    coreGlow.addColorStop(1, 'rgba(109,243,255,0)');
    ctx.fillStyle = coreGlow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR * 3.4, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = 'rgba(160,250,255,.95)';
    ctx.shadowBlur = 22 * coreBoost;
    ctx.beginPath();
    ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ======================================================================
   *  BRIEF ME — plays jarvis_brief.mp3 when available, and drives the
   *  sphere's speaking pulse from a synthetic envelope regardless (so the
   *  effect still works with no audio file / no network / offline).
   * ==================================================================== */
  var briefBtn = document.getElementById('briefBtn');
  var briefAudio = document.getElementById('briefAudio');
  var FALLBACK_SPEAK_MS = 7500;

  function startSpeaking(){
    speaking = true;
    speakStart = performance.now();
    speakPhases = [Math.random() * Math.PI * 2, Math.random() * Math.PI * 2, Math.random() * Math.PI * 2];
    briefBtn.textContent = 'SPEAKING';
    briefBtn.classList.add('speaking');
  }

  function stopSpeaking(){
    speaking = false;
    briefBtn.textContent = 'BRIEF ME';
    briefBtn.classList.remove('speaking');
    if (briefTimeout) { clearTimeout(briefTimeout); briefTimeout = null; }
  }

  briefAudio.addEventListener('ended', stopSpeaking);
  briefAudio.addEventListener('error', function(){ /* handled by fallback timer below */ });

  briefBtn.addEventListener('click', function(){
    if (speaking) return; // already talking
    startSpeaking();

    var usedRealAudio = false;
    try {
      briefAudio.currentTime = 0;
      var playPromise = briefAudio.play();
      if (playPromise && typeof playPromise.then === 'function') {
        playPromise.then(function(){
          usedRealAudio = true;
        }).catch(function(){
          // no file / autoplay blocked / offline — synthetic envelope still runs
        });
      }
    } catch (e) { /* ignore, fallback timer covers it */ }

    if (briefTimeout) clearTimeout(briefTimeout);
    briefTimeout = setTimeout(function(){
      // only auto-stop from the fallback timer if real audio isn't driving 'ended'
      if (briefAudio.paused || briefAudio.error || !usedRealAudio) stopSpeaking();
    }, FALLBACK_SPEAK_MS);
  });

})();
</script>
</body>
</html>
